[project]
name = "clipforge"
version = "0.1.0"
description = "AI-assisted long-form to short-form video clipping engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "redis>=6.1,<7",  # kombu (celery[redis]) requires redis-py >= 6.1
    "structlog>=24.4",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt>=2.9,<3",
    "email-validator>=2.2,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
# Speech stack (torch 2.8 + CUDA wheels, faster-whisper, wav2vec2 alignment, pyannote). Installed in the image.
asr = [
    "whisperx==3.8.6",  # keep in sync with requirements/heavy.txt
]
# Scene detection + frame analysis (Phase 3+)
analysis = [
    "scenedetect>=0.6.4,<0.7",
    "opencv-python-headless>=4.10,<5",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipforge = ["engine/highlights/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Postgres/Redis (run inside docker compose)",
    "media: needs ffmpeg/ffprobe on PATH (run inside docker compose)",
    "gpu: needs an NVIDIA GPU and downloads ASR models (run on worker-gpu)",
    "slow: takes minutes (real models on CPU, long audio)",
]
addopts = "-m 'not integration and not gpu and not media and not slow'"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["clipforge"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pwdlib.*", "whisperx.*", "torch.*", "numpy.*", "pyannote.*", "scenedetect.*", "cv2.*", "transformers.*"]
ignore_missing_imports = true

# Celery's decorators and kombu are untyped; keep strictness everywhere else.
[[tool.mypy.overrides]]
module = ["clipforge.workers.*"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
